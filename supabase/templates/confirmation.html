<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#0d2010;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0d2010;padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="440" cellpadding="0" cellspacing="0" style="max-width:440px;background:#13300f;border:1px solid #2e5d2a;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="padding:32px 32px 8px 32px;text-align:center;">
                <div style="font-size:40px;line-height:1;">🌳</div>
                <h1 style="margin:12px 0 0 0;color:#eae3cf;font-size:22px;">Welcome to Budget Tree</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0 32px;text-align:center;">
                <p style="margin:0;color:#8fae7e;font-size:14px;line-height:1.5;">
                  Enter this code in the app to confirm your account.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px;text-align:center;">
                <div style="display:inline-block;background:#0d2010;border:1px solid #5a8f4f;border-radius:12px;padding:16px 28px;color:#b6e6a6;font-size:32px;font-weight:bold;letter-spacing:10px;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 32px 32px;text-align:center;">
                <p style="margin:0;color:#6f8a63;font-size:12px;line-height:1.5;">
                  This code expires in one hour. If you did not create a Budget Tree account, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
